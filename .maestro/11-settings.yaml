# Settings, and the only question that matters about them: do they survive?
#
# Two of these are stored on the server against the account and two are stored on
# the device, and both kinds looked like they saved and then reverted on the next
# launch. So every change here is made, restarted, and checked again.
appId: com.foxacademy.app
name: Change settings and restart
tags:
  - settings
---
- runFlow: subflows/wait-for-app.yaml
- runFlow:
    file: subflows/open-tab.yaml
    env:
      TAB: 'More'
- tapOn:
    id: 'more-settings'
- assertVisible:
    id: 'screen-settings'

# Appearance and accent are device settings, applied immediately.
- tapOn:
    id: 'settings-theme-dark'
- tapOn:
    id: 'settings-accent-forest'

# Reminders ask for permission at the moment they are switched on, which is the
# one place a system dialog can interrupt a flow — hence the optional tap.
- scrollUntilVisible:
    element:
      id: 'settings-reminders'
    direction: DOWN
- tapOn:
    id: 'settings-reminders'
- tapOn:
    text: 'Allow'
    optional: true
- extendedWaitUntil:
    visible:
      id: 'settings-reminder-lead'
    timeout: 30000
- tapOn:
    id: 'settings-reminder-lead-60'

# Marking off, which is the one a tutor without marks notices most.
#
# This assertion earned its keep. It failed for two separate reasons and only the
# second was interesting.
#
# The hint is scrolled to, not asserted where it should be. It renders *below* the
# row that was just tapped, at the bottom of a long screen, and content below the
# fold is absent from the accessibility tree rather than merely out of sight — so
# waiting for it in place waits forever.
#
# Three wrong answers went in here before that one. A settle, a reopen, and
# `centerElement` on the scroll — the last actively made it worse, leaving the
# screen back at the top. What settled it was the database: `gradesEnabled` was
# already `false`, so the tap had always worked and only the assertion could not
# see its effect.
#
# Worth the trouble, because failing here also skipped the steps at the end that
# put the hidden tab back, and that failed four later flows for reasons of their
# own.
- scrollUntilVisible:
    element:
      id: 'settings-grades'
    direction: DOWN
    timeout: 30000
- tapOn:
    id: 'settings-grades'
- scrollUntilVisible:
    element:
      id: 'settings-grades-off'
    direction: DOWN
    timeout: 30000

# Hiding a tab, and the one tab that may never be hidden — hiding "More" would
# lock the user out of the screen that could bring it back.
- scrollUntilVisible:
    element:
      id: 'settings-tab-news-toggle'
    direction: DOWN
- tapOn:
    id: 'settings-tab-news-toggle'
- assertNotVisible:
    id: 'settings-tab-more-toggle'

# Settings is pushed over the tab bar, so leaving it is the only way back to the
# tabs — the bar is not there to tap while this screen is up.
- back
- runFlow:
    file: subflows/open-tab.yaml
    env:
      TAB: 'Calendar'
- assertVisible:
    id: 'screen-calendar'
- assertNotVisible: 'News'

# --- and now the only assertion that counts ---
- stopApp
- launchApp
- extendedWaitUntil:
    visible:
      id: 'screen-calendar'
    timeout: 90000
- assertNotVisible: 'News'

- runFlow:
    file: subflows/open-tab.yaml
    env:
      TAB: 'More'
- tapOn:
    id: 'more-settings'
# Scrolled to, for the same reason as above: the hint sits below the row and below
# the fold. The scroll doubles as the wait, which this needs too — the setting
# lives on the server, so after a restart the screen renders what it has and
# corrects itself when the config arrives.
- scrollUntilVisible:
    element:
      id: 'settings-grades-off'
    direction: DOWN
    timeout: 30000
- scrollUntilVisible:
    element:
      id: 'settings-reminder-lead'
    direction: UP
- assertVisible:
    id: 'settings-reminder-lead'

# Put it all back, so the flows after this one find the app as they expect it —
# and so this one can be run twice. Reminders included: leaving them on meant a
# second run toggled them *off*, and the lead-time row it then looked for was
# correctly absent.
- scrollUntilVisible:
    element:
      id: 'settings-reminders'
    direction: UP
- tapOn:
    id: 'settings-reminders'
- extendedWaitUntil:
    notVisible:
      id: 'settings-reminder-lead'
    timeout: 30000

- scrollUntilVisible:
    element:
      id: 'settings-grades'
    direction: DOWN
- tapOn:
    id: 'settings-grades'
- scrollUntilVisible:
    element:
      id: 'settings-tab-reset'
    direction: DOWN
- tapOn:
    id: 'settings-tab-reset'
- scrollUntilVisible:
    element:
      id: 'settings-theme-system'
    direction: UP
- tapOn:
    id: 'settings-theme-system'
- back
- runFlow:
    file: subflows/open-tab.yaml
    env:
      TAB: 'News'
- assertVisible:
    id: 'screen-news'
