# A student, then a group with that student in it.
#
# The reason both live in one flow: a group is only interesting once somebody is
# in it, and creating the student separately would mean either a second account
# or a flow that depends on the order of the one before it in a way nothing
# states. Here the dependency is visible.
appId: com.foxacademy.app
name: Add a student and put them in a group
env:
  STUDENT: 'Maestro-Student'
  GROUP: 'Maestro-Group'
---
- launchApp
- extendedWaitUntil:
    visible:
      id: 'screen-calendar'
    timeout: 90000

- tapOn: 'Students'
- assertVisible:
    id: 'screen-students'

- tapOn:
    id: 'students-add'
- tapOn:
    id: 'student-name'
- inputText: ${STUDENT}
- tapOn:
    id: 'student-subject'
- inputText: 'Mathematics'
- hideKeyboard
- tapOn:
    id: 'student-save'

# The roster comes back from the server, so this is also the check that the write
# actually landed rather than only being accepted locally.
- extendedWaitUntil:
    visible: ${STUDENT}
    timeout: 30000

# --- the group half ---
- tapOn: 'Groups'
- tapOn:
    id: 'students-add'
- tapOn:
    id: 'group-name'
- inputText: ${GROUP}
- tapOn:
    id: 'group-subject'
- inputText: 'Mathematics'
- hideKeyboard
- tapOn:
    id: 'group-save'

- extendedWaitUntil:
    visible: ${GROUP}
    timeout: 30000

# Membership only exists once the group does, which is why the sheet has to be
# reopened rather than filled in one pass.
- tapOn: ${GROUP}
- tapOn:
    id: 'group-add-member'
- tapOn: ${STUDENT}

# Back on the list the group should now count one member.
- assertVisible: '1 student'
