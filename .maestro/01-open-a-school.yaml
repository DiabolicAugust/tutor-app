# Registering must leave you *inside* the app.
#
# This is the flow that would have caught the sign-in bug: registration always
# returned a session and the app always adopted it, but the token reached the HTTP
# layer one tick too late, the first request came back 401, and the session was
# cleared before anything rendered. The screen assertion at the end is the whole
# point — "the request succeeded" was never the part that was broken.
appId: com.foxacademy.app
name: Open a school and land inside the app
# EMAIL and SCHOOL come from the runner, which stamps them with the time: a
# school name and an admin email can each be registered once, so hard-coding
# either would pass exactly one run. Deliberately *not* declared here with empty
# defaults — that shadowed the values passed with `-e` and quietly submitted a
# blank form.
---
- clearState
- launchApp

# With no session the app opens on sign-in, not on registration — the root
# guard's unauthenticated group lists sign-in first, so that is the entry point.
- assertVisible:
    id: 'signin-email'
- tapOn:
    id: 'signin-create-account'

- assertVisible:
    id: 'join-open-school'
- tapOn:
    id: 'join-open-school'

- tapOn:
    id: 'school-name'
- inputText: ${SCHOOL}
# The soft keyboard covers the button below it, and on this emulator it opens in
# floating mode over the middle of the screen.
- hideKeyboard
- tapOn:
    id: 'school-continue'

- tapOn:
    id: 'admin-name'
- inputText: 'Maestro Admin'
- tapOn:
    id: 'admin-email'
- inputText: ${EMAIL}
- tapOn:
    id: 'admin-password'
- inputText: 'maestro-password-123'
- hideKeyboard

- tapOn:
    id: 'school-create'

# Generous, and on purpose: a free-tier host spins down when idle, so the first
# request of a run can take the better part of a minute to wake it.
- extendedWaitUntil:
    visible:
      id: 'screen-calendar'
    timeout: 90000
