# Running the school: who is in it, who has been asked, and telling them things.
#
# The tutor list showing "Loading…" for a school that simply has nobody else in it
# was the app claiming to be working after it had finished. The admin themselves
# is always in that list, which is why the empty state here belongs to invitations
# rather than to tutors.
appId: com.foxacademy.app
name: Run the school — subjects, an invitation, an announcement
tags:
  - school
  - subjects
---
- runFlow: subflows/wait-for-app.yaml
- runFlow:
    file: subflows/open-tab.yaml
    env:
      TAB: 'More'
- tapOn:
    id: 'more-school'
- assertVisible:
    id: 'screen-school'

# A school with one person in it lists nobody: the endpoint returns colleagues,
# not the caller. Which is the assertion worth making — this said "Loading…" for a
# school that had finished loading and simply had nobody else in it, and an empty
# list that claims to be working is how an app looks broken.
- extendedWaitUntil:
    visible:
      id: 'school-tutors-empty'
    timeout: 60000
- assertVisible:
    id: 'school-no-invitations'

# --- an invitation ---
# Scrolled to rather than tapped where it used to be: the subjects card sits
# above these buttons, so the screen is longer than it was and `tapOn` does not
# scroll.
- scrollUntilVisible:
    element:
      id: 'school-invite'
    direction: DOWN
    timeout: 30000
- tapOn:
    id: 'school-invite'
- assertVisible:
    id: 'invite-sheet'
- tapOn:
    id: 'invite-email'
- inputText: 'not-an-address'
- runFlow: subflows/dismiss-keyboard.yaml
- tapOn:
    id: 'invite-send'
- assertVisible: 'Enter a valid email address.'

- tapOn:
    id: 'invite-email'
- eraseText
- inputText: ${INVITEE}
- runFlow: subflows/dismiss-keyboard.yaml
- tapOn:
    id: 'invite-send'
- extendedWaitUntil:
    notVisible:
      id: 'invite-sheet'
    timeout: 60000
- extendedWaitUntil:
    visible:
      id: 'school-invitation-0'
    timeout: 30000
- assertVisible: ${INVITEE}
- assertVisible: 'Pending'

# --- the other way the invitation can travel ---
#
# The email goes to an address nobody reads, and on a machine with no mail
# provider it goes nowhere at all. So the link the admin can send themselves is
# the half of this feature that a run can actually see — and it is the half that
# works when the mail does not.
#
# The share sheet itself belongs to the OS and is not opened here, for the reason
# flow 15 gives: tapping it hands the run to another app with no reliable way
# back. What is asserted is that the control is offered.
- scrollUntilVisible:
    element:
      id: 'invitation-sent'
    direction: UP
    timeout: 30000
- assertVisible:
    id: 'invitation-sent-share'
- tapOn:
    id: 'invitation-sent-dismiss'
- assertNotVisible:
    id: 'invitation-sent'

# The link stays reachable after the card is gone, which is the point of putting
# it on the row as well: an admin who dismissed this and then found the message
# never arrived has somewhere to go. Offered only while something is still
# pending, so the hint appears exactly when a row would do anything.
- scrollUntilVisible:
    element:
      id: 'school-invitation-0-row'
    direction: DOWN
    timeout: 30000
- assertVisible:
    id: 'school-invite-resend-hint'

# --- an announcement ---
- scrollUntilVisible:
    element:
      id: 'school-announce'
    direction: DOWN
    timeout: 30000
- tapOn:
    id: 'school-announce'
- assertVisible:
    id: 'announce-sheet'
- tapOn:
    id: 'announce-message'
- inputText: 'Hi'
- runFlow: subflows/dismiss-keyboard.yaml
- tapOn:
    id: 'announce-send'
- assertVisible: 'Write at least a few words.'

- tapOn:
    id: 'announce-message'
- eraseText
- inputText: 'Term ends on the 20th. Please confirm your last lessons.'
- runFlow: subflows/dismiss-keyboard.yaml
- tapOn:
    id: 'announce-send'
- extendedWaitUntil:
    visible:
      id: 'announcement-sent'
    timeout: 60000

# --- the subject list, which is what every record is written in ---
#
# Earlier flows put Mathematics here by adding a student, so the list is not
# empty by the time this runs. Everything below happens to a subject created
# here, because it is the only one nothing else in the suite is studying — and
# then the refusal is checked against Mathematics, which two students are.
- scrollUntilVisible:
    element:
      id: 'subjects-add'
    direction: DOWN
    timeout: 30000
- assertVisible: 'Mathematics'

- tapOn:
    id: 'subjects-add'
- assertVisible:
    id: 'subject-add-sheet'
- tapOn:
    id: 'subject-add-name'
- inputText: 'Latin'
- runFlow: subflows/dismiss-keyboard.yaml
- tapOn:
    id: 'subject-add-save'
- extendedWaitUntil:
    notVisible:
      id: 'subject-add-sheet'
    timeout: 30000
- extendedWaitUntil:
    visible: 'Latin'
    timeout: 30000

# The same name again is refused, and says so rather than making a second one.
- tapOn:
    id: 'subjects-add'
- tapOn:
    id: 'subject-add-name'
- inputText: 'Latin'
- runFlow: subflows/dismiss-keyboard.yaml
- tapOn:
    id: 'subject-add-save'
- extendedWaitUntil:
    visible: 'Your school already teaches that.'
    timeout: 30000
- tapOn:
    id: 'subject-add-sheet-close'
- extendedWaitUntil:
    notVisible:
      id: 'subject-add-sheet'
    timeout: 30000
# Reopened rather than waited out. Waiting was the earlier answer and it kept
# failing: the rows are still reflowing into the space the sheet gave back, *and*
# the list re-sorts when the server's copy lands, so a row can move between
# Maestro resolving where it is and the tap arriving. Three runs have opened
# Mathematics having asked for Latin. See the subflow.
- runFlow: subflows/reopen-school.yaml

# Renaming corrects it everywhere at once, which is the reason this is a list and
# not a word typed onto each record.
- scrollUntilVisible:
    element:
      text: 'Latin'
    direction: DOWN
    timeout: 30000
- tapOn: 'Latin'
- assertVisible:
    id: 'subject-edit-sheet'
# Which subject is open, asserted rather than hoped for. The rename field is
# identical whichever row was tapped, so the title is the only thing that says
# — and without this a mis-tap surfaced three steps later as a refusal that read
# like a bug in retiring.
- assertVisible:
    id: 'subject-edit-sheet-title'
    text: 'Latin'
# The field, before anything is typed into it: a sheet still animating open
# swallows input the same way a closing one misplaces taps.
- assertVisible:
    id: 'subject-rename-name'
- tapOn:
    id: 'subject-rename-name'
- eraseText
- inputText: 'Latin B'
- runFlow: subflows/dismiss-keyboard.yaml
- tapOn:
    id: 'subject-rename-save'
- extendedWaitUntil:
    visible: 'Latin B'
    timeout: 30000
- extendedWaitUntil:
    notVisible:
      id: 'subject-edit-sheet'
    timeout: 30000
# The same reopen, for the same reason: a rename re-sorts the list too.
- runFlow: subflows/reopen-school.yaml

# Retiring one that nothing studies goes through, and it leaves the list without
# being deleted — which the restore below is the proof of.
- scrollUntilVisible:
    element:
      text: 'Latin B'
    direction: DOWN
    timeout: 30000
- tapOn: 'Latin B'
- assertVisible:
    id: 'subject-edit-sheet'
- assertVisible:
    id: 'subject-edit-sheet-title'
    text: 'Latin B'
- tapOn:
    id: 'subject-retire'
# Gone from the sheet *and* from the list. Asserting only that the name has
# vanished is not enough: a refusal opens a sheet of its own on top, and the name
# disappears behind it either way.
- extendedWaitUntil:
    notVisible:
      id: 'subject-edit-sheet'
    timeout: 30000
- assertNotVisible:
    id: 'subject-in-use-sheet'
- assertNotVisible: 'Latin B'

# The toggle sits under the list, so retiring a subject moves it up the screen.
- runFlow: subflows/settle.yaml
- tapOn:
    id: 'subjects-toggle-retired'
- assertVisible:
    id: 'subject-retired-0'
- assertVisible: 'Latin B'
- tapOn:
    id: 'subject-retired-0'
- extendedWaitUntil:
    visible: 'Latin B'
    timeout: 30000

# And the rule the whole model exists for: a subject somebody is studying cannot
# be taken off the list, and the refusal says who has to be moved first.
# Reopened here as well. Restoring a subject puts a row back and moves everything
# below it, which is the same hazard as the two above — and the mis-tap it caused
# surfaced as a refusal that read like a bug in retiring rather than a bad tap.
- runFlow: subflows/reopen-school.yaml
- scrollUntilVisible:
    element:
      text: 'Mathematics'
    direction: DOWN
    timeout: 30000
- tapOn: 'Mathematics'
- assertVisible:
    id: 'subject-edit-sheet'
- assertVisible:
    id: 'subject-edit-sheet-title'
    text: 'Mathematics'
- tapOn:
    id: 'subject-retire'
- extendedWaitUntil:
    visible:
      id: 'subject-in-use-sheet'
    timeout: 30000
- assertVisible: ${STUDENT}
- tapOn:
    id: 'subject-in-use-close'

# It appears in News for every member of the school, which is where the sender
# sees it too — and is the only part of this a test can verify end to end.
- back
- runFlow:
    file: subflows/open-tab.yaml
    env:
      TAB: 'News'
- extendedWaitUntil:
    visible: 'Term ends on the 20th. Please confirm your last lessons.'
    timeout: 60000
- assertVisible:
    id: 'notification-adminAnnouncement'

# Marking the feed read has to leave the button with nothing to do, which is also
# its own confirmation.
- assertVisible:
    id: 'news-mark-all-read'
- tapOn:
    id: 'news-mark-all-read'
- assertNotVisible:
    id: 'news-mark-all-read'
