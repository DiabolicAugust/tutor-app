# Signing out and back in must also leave you inside the app.
#
# Runs after 01, which created the account. Kept separate because the two paths
# reached the same bug by different routes, and a single flow covering both would
# not say which one regressed.
appId: com.foxacademy.app
name: Sign out and sign back in
# EMAIL comes from the runner and must be the account flow 01 created.
---
- launchApp

# Signed in already, from the previous flow — no `clearState` here on purpose.
- extendedWaitUntil:
    visible:
      id: 'screen-calendar'
    timeout: 90000

- tapOn: 'More'
- assertVisible:
    id: 'screen-more'
- tapOn:
    id: 'more-sign-out'

- assertVisible:
    id: 'signin-email'
- tapOn:
    id: 'signin-email'
- inputText: ${EMAIL}
- tapOn:
    id: 'signin-password'
- inputText: 'maestro-password-123'
- hideKeyboard
- tapOn:
    id: 'signin-submit'

# The assertion that failed before the fix: sign-in succeeded, then a 401 on the
# first authenticated request signed the user straight back out.
- extendedWaitUntil:
    visible:
      id: 'screen-calendar'
    timeout: 90000

# And it has to survive a restart, which is the other half of the same bug — the
# restored token was published in an effect that ran after the first request.
- stopApp
- launchApp
- extendedWaitUntil:
    visible:
      id: 'screen-calendar'
    timeout: 90000
